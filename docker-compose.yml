services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    ports:
      - "4000:4000"
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-db
    volumes:
      - jwt_keys:/run/keys

  stego-service:
    build: ./stego-service
    ports:
      - "5000:5000"
    env_file:
      - ./stego-service/.env
    depends_on:
      - auth-service
    volumes:
      - jwt_keys:/run/keys:ro
      - stego_data:/app/data

volumes:
  auth_db_data:
  jwt_keys:
  stego_data:
